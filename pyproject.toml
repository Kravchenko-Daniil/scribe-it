[project]
name = "scribe-it"
version = "0.1.0"
description = "Telegram bot for transcribing video/audio via ElevenLabs Scribe"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.10",
    "bgutil-ytdlp-pot-provider>=1.1",
    "fastapi>=0.139.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "requests>=2.32",
    "telethon>=1.36",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.1.1",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.28.1",
]
